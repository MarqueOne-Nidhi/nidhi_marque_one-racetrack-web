<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/logo-red.png">
  <link rel="shortcut icon" type="image/png" href="/logo-red.png">
  <!-- The SERP snippet is the headline for anyone arriving from search, so it
       carries the same promise as HERO in src/data/home.js. Keep the two in
       step: changing one without the other splits the positioning. -->
  <title>Marque One: Drive an FIA-graded circuit in your own car</title>
  <meta name="description"
    content="Drive an FIA-graded circuit in your own car, two hours from Bengaluru. No membership, no competition licence, no race car. Circuit, drag strip, off-road course, skid pan.">

  <!-- OpenGraph -->
  <meta property="og:title" content="Marque One: Drive an FIA-graded circuit in your own car">
  <meta property="og:description"
    content="A motorsport club two hours from Bengaluru. Open to drivers, to groups, to business, and to anyone who simply wants the weekend. No membership required.">
  <meta property="og:image" content="/assets/images/hero_club_moment.png">
  <meta property="og:type" content="website">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Estonia is loaded here rather than via @import in index.css: an @import
       inside a stylesheet cannot start downloading until that stylesheet has
       itself parsed, which serialises the request behind the CSS. It is used
       by exactly one element, the ONE of ONE.CLUB on the club page, so the
       font file only downloads on that route, where a glyph actually renders. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Estonia&family=Inter:wght@200;300;400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body class="bg-dark text-ivory antialiased selection:bg-ivory-darker selection:text-dark overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
